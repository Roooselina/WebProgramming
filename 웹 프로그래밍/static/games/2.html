<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Matching Game</title>
    <style>
        @font-face {
            font-family: "Migae";
            src: url("path_to_your_font/Migae.woff") format("woff");
        }

        canvas {
            background: #000;
            /* 검은색 배경 */
            display: block;
            margin: 0 auto;
            width: 100%;
            height: 99vh;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.95; // 높이를 95%로 조정
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameStarted = false;
        let levelSelected = false; // 추가: 레벨이 선택되었는지 여부
        let selectedLevel = 0; // 0: EASY, 1: MEDIUM, 2: HARD
        const levels = ["EASY", "MEDIUM", "HARD"];
        const descriptions = [
            "EASY : 5쌍의 랜덤한 이미지가 등장합니다.",
            "MEDIUM: 10쌍의 랜덤한 이미지가 등장합니다.",
            "HARD: 18쌍의 랜덤한 이미지가 등장합니다."
        ];

        let cards = [];
        let firstCard = null;
        let secondCard = null;
        let isProcessing = false;
        let currentPlayer = "human"; // "robot" 또는 "human"
        let scores = { robot: 0, human: 0 };

        // 이미지 캐싱을 위한 객체
        const imagesCache = {};

        document.addEventListener("keydown", (e) => {
            if (e.key === " " && !gameStarted) {
                gameStarted = true;
                startGame();
            } else if (gameStarted && !levelSelected) {
                if (e.key === "A" || e.key === "ArrowLeft") {
                    selectedLevel = Math.max(0, selectedLevel - 1); // 왼쪽으로 이동
                    drawLevelSelection(); // 레벨 선택 화면 갱신
                } else if (e.key === "D" || e.key === "ArrowRight") {
                    selectedLevel = Math.min(levels.length - 1, selectedLevel + 1); // 오른쪽으로 이동
                    drawLevelSelection(); // 레벨 선택 화면 갱신
                } else if (e.key === " ") {
                    // 스페이스를 눌러서 현재 선택된 난이도를 확정하고 게임 시작
                    levelSelected = true; // 레벨 선택 완료로 설정
                    startLevel(selectedLevel);
                }
            }
        });

        function drawStartMessage() {
            ctx.font = "40px Migae, Arial, sans-serif";
            ctx.fillStyle = "#FFF"; // 흰색 글자
            ctx.textAlign = "center";
            ctx.fillText("PRESS SPACE TO START", canvas.width / 2, canvas.height / 2);
        }


        function startGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 효과음 재생
            const beepAudio = new Audio('../music/CardGame.mp3');
            beepAudio.volume = 0.2;
            beepAudio.play();

            drawLevelSelection();
        }

        function drawLevelSelection() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 화면 초기화

            // "Choose the Level" 메시지
            ctx.font = "80px Migae, Arial, sans-serif";
            ctx.fillStyle = "#FFF";
            ctx.textAlign = "center";
            ctx.fillText("Choose the Level", canvas.width / 2, canvas.height / 3);

            // 레벨 설명
            ctx.font = "30px Migae, Arial, sans-serif";
            const descriptionY = canvas.height / 3 + 100; // 설명 위치 (Choose the Level 아래)
            const lineXStart = canvas.width / 4; // 선의 시작 X 좌표
            const lineXEnd = canvas.width * 3 / 4; // 선의 끝 X 좌표
            const lineOffset = 100; // 선과 설명 사이 간격

            // 설명 위 선
            ctx.beginPath();
            ctx.moveTo(lineXStart, descriptionY - lineOffset + 50);
            ctx.lineTo(lineXEnd, descriptionY - lineOffset + 50);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 설명 텍스트
            ctx.fillText(descriptions[selectedLevel], canvas.width / 2 + 60, descriptionY);

            // 설명 아래 선
            ctx.beginPath();
            ctx.moveTo(lineXStart, descriptionY + lineOffset);
            ctx.lineTo(lineXEnd, descriptionY + lineOffset);
            ctx.stroke();

            // 레벨 텍스트
            ctx.font = "40px Migae, Arial, sans-serif";
            const baseY = canvas.height / 2 + 200; // 레벨 텍스트의 Y 시작 위치
            const baseSpacing = 80; // 기본 레벨 간의 간격
            const extraSpacing = 200; // 추가 간격
            const spacing = baseSpacing + extraSpacing; // 총 간격

            levels.forEach((level, index) => {
                const x = canvas.width / 2 - ((levels.length - 1) * spacing) / 2 + index * spacing; // 레벨 간격 계산
                if (index === selectedLevel) {
                    ctx.fillText("> " + level, x, baseY);
                } else {
                    ctx.fillText(level, x, baseY);
                }
            });
        }

        function startLevel(level) {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 화면 초기화
            ctx.font = "50px Migae, Arial, sans-serif";
            ctx.fillStyle = "#FFF";
            ctx.textAlign = "center";
            ctx.fillText(`Starting Level: ${levels[level]}`, canvas.width / 2, canvas.height / 2);

            // 1초 후에 다음 단계를 실행
            setTimeout(() => {
                loadImagesForLevel(level);
            }, 1000);
        }

        function loadImagesForLevel(level) {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 화면 초기화

            let pairCount;
            if (level === 0) { // EASY
                pairCount = 5;
            } else if (level === 1) { // MEDIUM
                pairCount = 10;
            } else { // HARD
                pairCount = 18;
            }

            // 이미지 파일 이름 배열 생성
            // 여기에 사용할 카드 이름 저장
            const images = [];
            for (let i = 0; i < pairCount; i++) {
                images.push(`../images/game/2/trump${i}.jpg`);
            }

            // 각 이미지를 두 개씩 복제하여 카드 배열 생성
            let selectedImages = [...images, ...images];

            // 카드 배열 섞기
            selectedImages.sort(() => 0.5 - Math.random());

            // 이미지 로드
            const imageSources = [
                '../images/game/2/Background.jpg',
                '../images/game/2/Robot.png',
                '../images/game/2/Human.png',
                '../images/game/2/trump0.jpg',
                ...images
            ];

            let imagesLoaded = 0;
            const totalImages = imageSources.length;

            // 이미지 로드
            imageSources.forEach(src => {
                if (!imagesCache[src]) {
                    const img = new Image();
                    img.src = src;
                    img.setAttribute('data-id', src); // data-id 속성에 src 저장
                    img.onload = () => {
                        imagesLoaded++;
                        if (imagesLoaded === totalImages) {
                            drawSelectedImages(selectedImages, level);
                        }
                    };
                    imagesCache[src] = img;
                } else {
                    imagesLoaded++;
                    if (imagesLoaded === totalImages) {
                        drawSelectedImages(selectedImages, level);
                    }
                }
            });
        }

        function drawSelectedImages(selectedImages, level) {
            const imageObjects = selectedImages.map(src => imagesCache[src]);

            // 배경 이미지 그리기
            ctx.drawImage(imagesCache['../images/game/2/Background.jpg'], 0, 0, canvas.width, canvas.height);

            // 카드 초기화
            initializeCards(imageObjects, level);
        }

        function initializeCards(imageObjects, level) {
            cards = [];
            let rows, columns;

            // 카드 행 열
            if (level === 0) { // EASY
                rows = 2;
                columns = 5;
            } else if (level === 1) { // MEDIUM
                rows = 4;
                columns = 5;
            } else { // HARD
                rows = 3;
                columns = 12;
            }

            const padding = 30; // 이미지 간격
            const imageWidth = 120; // 이미지 너비
            const imageHeight = 180; // 이미지 높이

            // 그리드 총 너비와 높이 계산
            const totalWidth = columns * (imageWidth + padding) - padding;
            const totalHeight = rows * (imageHeight + padding) - padding;

            // 캔버스의 중앙에 맞추기 위한 시작 위치 계산
            const startX = (canvas.width - totalWidth) / 2;
            const startY = (canvas.height - totalHeight) / 2;

            // 카드 초기화
            for (let i = 0; i < imageObjects.length; i++) {
                const col = i % columns;
                const row = Math.floor(i / columns);
                const x = startX + col * (imageWidth + padding);
                const y = startY + row * (imageHeight + padding);

                cards.push({
                    img: imageObjects[i],
                    x,
                    y,
                    width: imageWidth,
                    height: imageHeight,
                    isFlipped: false,
                    isMatched: false,
                    id: imageObjects[i].getAttribute('data-id') // 이미지의 data-id 사용
                });
            }

            // 플레이어 표시 및 점수 업데이트
            drawPlayers(startY);

            // 카드 그리기
            drawCards();

            // 이벤트 리스너 추가
            canvas.addEventListener("click", handleCardClick);
        }

        function drawCards() {
            // 배경 다시 그리기
            ctx.drawImage(imagesCache['../images/game/2/Background.jpg'], 0, 0, canvas.width, canvas.height);

            // 각 카드 그리기
            cards.forEach((card) => {
                if (card.isFlipped || card.isMatched) {
                    // 앞면 이미지를 렌더링
                    ctx.drawImage(card.img, card.x, card.y, card.width, card.height);
                } else {
                    // 그림자 설정
                    ctx.shadowColor = "rgba(0, 0, 0, 0.5)"; // 그림자 색상
                    ctx.shadowBlur = 10;                   // 그림자 흐림 정도
                    ctx.shadowOffsetX = 5;                 // 그림자의 X축 오프셋
                    ctx.shadowOffsetY = 5;                 // 그림자의 Y축 오프셋

                    // 카드 뒷면 이미지를 그림자와 함께 렌더링
                    ctx.drawImage(imagesCache['../images/game/2/trump0.jpg'], card.x, card.y, card.width, card.height);

                }
            });

            // 플레이어 표시 및 점수 업데이트
            drawPlayers(cards[0].y - 200);
        }


        function drawPlayers(startY) {
            // 로봇 프로필
            const robotX = canvas.width / 4 - 400;
            const robotY = startY; // 카드 상단에 위치
            ctx.drawImage(imagesCache['../images/game/2/Robot.png'], robotX, robotY, 100, 100);

            // 로봇 점수
            ctx.font = "30px Arial, sans-serif";
            ctx.fillStyle = currentPlayer === "robot" ? "#FFD700" : "#FFF";
            ctx.textAlign = "left";
            ctx.fillText(`Score: ${scores.robot}`, robotX + 120, robotY + 50);

            // 사람 프로필
            const humanX = (canvas.width * 3) / 4 + 300;
            const humanY = startY;
            ctx.drawImage(imagesCache['../images/game/2/Human.png'], humanX, humanY, 100, 100);

            // 사람 점수 
            ctx.font = "30px Arial, sans-serif";
            ctx.fillStyle = currentPlayer === "human" ? "#FFD700" : "#FFF";
            ctx.textAlign = "right";
            ctx.fillText(`Score: ${scores.human}`, humanX - 20, humanY + 50);
        }

        function handleCardClick(event) {
            if (isProcessing) return; // 이미 처리 중일 경우 중단

            const rect = canvas.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            // 클릭한 카드 찾기
            for (let card of cards) {
                if (
                    clickX >= card.x &&
                    clickX <= card.x + card.width &&
                    clickY >= card.y &&
                    clickY <= card.y + card.height
                ) {
                    if (card.isFlipped || card.isMatched) {
                        return; // 이미 뒤집히거나 매칭된 카드일 경우 중단
                    }

                    // 카드 상태 업데이트 및 화면 갱신
                    card.isFlipped = true;
                    drawCards(); // 카드가 선택된 후 바로 화면을 업데이트하여 즉시 반영

                    if (!firstCard) {
                        firstCard = card;
                    } else if (!secondCard) {
                        secondCard = card;
                        isProcessing = true;

                        setTimeout(() => {
                            checkForMatch();
                        }, 1000);
                    }
                    break;
                }
            }
        }

        function checkForMatch() {
            if (firstCard && secondCard) { // 두 카드가 선택되었을 때만 검사
                if (firstCard.id === secondCard.id) {
                    // 매칭됨
                    firstCard.isMatched = true;
                    secondCard.isMatched = true;
                    scores[currentPlayer]++;

                    const beepAudio = new Audio('../music/Beep.mp3');
                    beepAudio.volume = 0.2;
                    beepAudio.play();

                } else {
                    // 매칭되지 않음
                    firstCard.isFlipped = false;
                    secondCard.isFlipped = false;
                    currentPlayer = currentPlayer === "human" ? "robot" : "human";
                }

                // 선택된 카드 초기화
                firstCard = null;
                secondCard = null;
                isProcessing = false;
                drawCards();
                checkGameOver();
            }
        }



        function checkGameOver() {
            if (cards.every(card => card.isMatched)) {
                // 게임 종료
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = "60px Migae, Arial, sans-serif";
                ctx.fillStyle = "#FFF";
                ctx.textAlign = "center";

                if (scores.human > scores.robot) {
                    ctx.fillText("Human Wins!", canvas.width / 2, canvas.height / 2);
                } else if (scores.robot > scores.human) {
                    ctx.fillText("Robot Wins!", canvas.width / 2, canvas.height / 2);
                } else {
                    ctx.fillText("It's a Tie!", canvas.width / 2, canvas.height / 2);
                }

                // Update the human score in the parent document
                updateParentScore(scores.human);

                // Enter 키를 누르면 페이지 새로 고침
                document.addEventListener('keydown', function (event) {
                    if (event.code === 'Enter') {
                        document.location.reload();
                    }
                });
            } else if (currentPlayer === "robot") {
                // 로봇 턴 교환
                setTimeout(robotTurn, 1000);
            }
        }

        // Function to update the score in the parent document
        function updateParentScore(score) {
            if (window.parent && window.parent.document) {
                const scoreElement = window.parent.document.getElementById('score');
                if (scoreElement) {
                    scoreElement.textContent = score;
                }
            }
        }



        function robotTurn() {
            // 매칭되지 않은 카드 중 랜덤으로 선택
            const availableCards = cards.filter(card => !card.isFlipped && !card.isMatched);
            if (availableCards.length === 0) return;

            // 첫 번째 카드 선택
            const firstIndex = Math.floor(Math.random() * availableCards.length);
            const firstCardChoice = availableCards[firstIndex];
            firstCardChoice.isFlipped = true;
            firstCard = firstCardChoice;
            setTimeout(() => { }, 10);
            drawCards();

            // 두 번째 카드 선택
            availableCards.splice(firstIndex, 1);
            const secondIndex = Math.floor(Math.random() * availableCards.length);
            const secondCardChoice = availableCards[secondIndex];
            secondCardChoice.isFlipped = true;
            secondCard = secondCardChoice;
            setTimeout(() => { }, 10);
            drawCards();

            isProcessing = true;

            setTimeout(() => {
                checkForMatch();
            }, 1000);
        }

        // 초기 메시지 표시
        drawStartMessage();
    </script>
</body>

</html>

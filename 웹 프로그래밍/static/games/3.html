<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /*초기 화면 변수*/
        #backgroundBlack {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-color: black;
        }

        /*게임 화면 변수*/
        #backgroundImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image: url('../images/game/3/background.png');
            background-size: 100%;
            background-position: center bottom;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        canvas {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: 95vh;
            width: 99%;
            position: relative;
            z-index: 2;
        }

        #animatedGif,
        #animatedGif2 {
            position: absolute;
            top: calc(20% + 60px);
            transform: translateX(-50%);
            z-index: 3;
            pointer-events: none;
            display: none;
            animation: pulse 1s infinite alternate;
        }

        #animatedGif {
            left: calc(50% - 300px);
            width: 217.075px;
            height: 368.125px;
        }

        #animatedGif2 {
            left: calc(50% + 100px);
            width: 228.5px;
            height: 387.5px;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            80% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.05);
            }
        }
    </style>
</head>

        function resizeCanvas() {
            canvas.width = window.innerWidth * 0.5;
            canvas.height = window.innerHeight * 0.95;
            sectionWidth = canvas.width / 8; 
            drawStartMessage();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawStartMessage() {
            const fontSize = Math.min(canvas.width, canvas.height) * 0.05;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = `${fontSize}px Arial`; 
            ctx.fillStyle = "#FFF";
            ctx.textAlign = "center";
            ctx.fillText("PRESS ENTER TO START", canvas.width / 2, canvas.height / 2);
        }

        function drawLines() {
            // 캔버스 초기화
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 2;

            // 가로선 그리기
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.06);
            ctx.lineTo(canvas.width, canvas.height * 0.06);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.9);
            ctx.lineTo(canvas.width, canvas.height * 0.9);
            ctx.stroke();

            // SCORE 그리기 메서드
            const scoreFontSize = Math.min(canvas.width, canvas.height) * 0.02;
            ctx.font = `${scoreFontSize}px Arial`;
            ctx.fillStyle = "#FFF";
            ctx.fillText(`SCORE: ${score}`, sectionWidth / 2, canvas.height * 0.03);
        }

        function generateFallingKey() {
            if (currentIndex < predefinedKeys.length) {
                const keyData = predefinedKeys[currentIndex];
                const key = keyData.key;

                let xPosition;
                if (keys.indexOf(key) >= 2) {
                    xPosition = sectionWidth * (keys.indexOf(key) + 4) + sectionWidth / 2;
                } else {
                    xPosition = sectionWidth * keys.indexOf(key) + sectionWidth / 2;
                }

                const yPosition = canvas.height * 0.065;
                fallingKeys.push({ key, x: xPosition, y: yPosition, botIndex: keyData.botIndex });

                currentIndex++;
            }
        }

        function drawFallingKeys() {
            const keyFontSize = Math.min(canvas.width, canvas.height) * 0.06;

            // 텍스트 스타일 설정
            ctx.font = `${keyFontSize}px 'Bauhaus 93'`;

            fallingKeys.forEach((keyObj) => {
                // 조건에 따라 색상 설정
                if (keyObj.botIndex === 1) {
                    ctx.fillStyle = "#000"; // 검정색
                } else if (keyObj.botIndex === 2) {
                    ctx.fillStyle = "#00F"; // 파란색
                }

                // 텍스트 렌더링
                ctx.fillText(keyObj.key, keyObj.x, keyObj.y);

                // 키 이동 (아래로 떨어짐)
                keyObj.y += 5; // 키가 떨어지는 속도

                // 특정 범위에 도달했을 때 botIndex 처리
                if (keyObj.y >= canvas.height * 0.8 && keyObj.y <= canvas.height * 0.9) {
                    if (keyObj.botIndex === 1) {
                        // RUV 애니메이션 처리
                        switch (keyObj.key) {
                            case 'W':
                                animatedGif_Ruv.src = "../images/game/3/Ruv_up.gif";
                                break;
                            case 'A':
                                animatedGif_Ruv.src = "../images/game/3/Ruv_left.gif";
                                break;
                            case 'S':
                                animatedGif_Ruv.src = "../images/game/3/Ruv_down.gif";
                                break;
                            case 'D':
                                animatedGif_Ruv.src = "../images/game/3/Ruv_right.gif";
                                break;
                            default:
                                animatedGif_Ruv.src = "../images/game/3/Ruv_idle.gif";
                                break;
                        }

                        // 배경 움직임 애니메이션 (한 번만 실행)
                        if (!backgroundMoved) {
                            animateBackgroundMove();
                            backgroundMoved = true; // 플래그 설정
                        }

                        // GIF를 0.5초 후 idle 상태로 복귀
                        if (idleTimeoutId) {
                            clearTimeout(idleTimeoutId);
                        }
                        idleTimeoutId = setTimeout(() => {
                            setIdleGif();
                        }, 500);

                    } else if (keyObj.botIndex === 2) {
                        // SELEVER 애니메이션 처리
                        if (backgroundMoved) {
                            backgroundMoved = false;
                            animateBackgroundReturn();
                        }

                        if (!backgroundMovedByUser) {
                            animateBackgroundMoveByUser();
                            backgroundMovedByUser = true;
                        }
                    }
                }
            });

            // 화면을 벗어난 키 제거
            fallingKeys = fallingKeys.filter(keyObj => keyObj.y < canvas.height * 0.9);
        }

        function animateBackgroundMove() {
            let startTime = null;
            const duration = 500;
            const moveDistance = 30;
            const initialLeft = parseInt(backgroundImage.style.left) || 0;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const moveLeft = moveDistance * progress;
                backgroundImage.style.left = `${initialLeft - moveLeft}px`;

                if (progress < 1) {
                    requestAnimationFrame(step);
                }
            }

            requestAnimationFrame(step);
        }

        // 게임 화면 이동 메서드
        function animateBackgroundReturn() {
            let startTime = null;
            const duration = 500; 
            const moveDistance = 30; 
            const initialLeft = parseInt(backgroundImage.style.left) || 0;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const moveBack = moveDistance * progress;
                backgroundImage.style.left = `${initialLeft + moveBack}px`;

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    backgroundImage.style.left = `${initialLeft + moveDistance}px`;
                    backgroundMovedByUser = false;
                    // 애니메이션 종료 후 아이들 타이머 리셋
                    resetIdleTimer();
                }
            }

            requestAnimationFrame(step);
        }

        function checkKeyPress(e) {
            const pressedKey = e.key.toUpperCase();

            // 키 입력 시 타이머 리셋
            resetIdleTimer();

            fallingKeys.forEach((keyObj, index) => {
                if (keyObj.botIndex === 2) {
                    if (!backgroundMovedByUser) {
                        animateBackgroundMoveByUser();
                        backgroundMovedByUser = true;
                    }
                    if (keyObj.key === pressedKey && keyObj.y >= canvas.height * 0.85 && keyObj.y <= canvas.height * 0.9) {
                        score += 10;
                        fallingKeys.splice(index, 1);
                    }
                }
            });

            // RUV 키 업데이트
            if (fallingKeys.some(keyObj => keyObj.botIndex === 2)) {
                switch (pressedKey) {
                    case 'W':
                        animatedGif_Selever.src = "../images/game/3/Selever_up.gif";
                        break;
                    case 'A':
                        animatedGif_Selever.src = "../images/game/3/Selever_left.gif";
                        break;
                    case 'S':
                        animatedGif_Selever.src = "../images/game/3/Selever_down.gif";
                        break;
                    case 'D':
                        animatedGif_Selever.src = "../images/game/3/Selever_right.gif";
                        break;
                    default:
                        animatedGif_Selever.src = "../images/game/3/Selever_idle.gif";
                        break;
                }

                if (timeoutId) {
                    clearTimeout(timeoutId);
                }
                timeoutId = setTimeout(() => {
                    animatedGif_Selever.src = "../images/game/3/Selever_idle.gif";
                }, 500);
            }
        }

        // 게임 배경 이동 메서드_USER
        function animateBackgroundMoveByUser() {
            let startTime = null;
            const duration = 500;
            const moveDistance = 30;
            const initialLeft = parseInt(backgroundImage.style.left) || 0;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const moveLeft = moveDistance * progress;
                backgroundImage.style.left = `${initialLeft + moveLeft}px`;

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    backgroundImage.style.left = `${initialLeft + moveDistance}px`;
                    // 애니메이션 종료 후 타이머 리셋
                    resetIdleTimer();
                }
            }

            requestAnimationFrame(step);
        }

        // 게임 배경 복구 메서드_USER
        function animateBackgroundReturnByUser() {
            let startTime = null;
            const duration = 500;
            const moveDistance = 30;
            const initialLeft = parseInt(backgroundImage.style.left) || 0;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const moveBack = moveDistance * progress;
                backgroundImage.style.left = `${initialLeft - moveBack}px`;

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    backgroundImage.style.left = `${initialLeft - moveDistance}px`;
                    backgroundMovedByUser = false; 
                    // 애니메이션 종료 후 아이들 타이머 리셋
                    resetIdleTimer();
                }
            }

            requestAnimationFrame(step);
        }

        function checkKeyPress(e) {
            const pressedKey = e.key.toUpperCase();

            fallingKeys.forEach((keyObj, index) => {
                if (keyObj.botIndex === 2) {
                    if (!backgroundMovedByUser) {
                        animateBackgroundMoveByUser();
                        backgroundMovedByUser = true; 
                    }
                    if (keyObj.key === pressedKey && keyObj.y >= canvas.height * 0.85 && keyObj.y <= canvas.height * 0.9) {
                        score += 10;
                        fallingKeys.splice(index, 1);
                    }
                }
            });

            // key에 따른 gif 업데이트
            switch (pressedKey) {
                case 'W':
                    animatedGif_Selever.src = "../images/game/3/Selever_up.gif";
                    break;
                case 'A':
                    animatedGif_Selever.src = "../images/game/3/Selever_left.gif";
                    break;
                case 'S':
                    animatedGif_Selever.src = "../images/game/3/Selever_down.gif";
                    break;
                case 'D':
                    animatedGif_Selever.src = "../images/game/3/Selever_right.gif";
                    break;
                default:
                    animatedGif_Selever.src = "../images/game/3/Selever_idle.gif";
                    break;
            }

            if (timeoutId) {
                clearTimeout(timeoutId);
            }

            // 0.5 초 내로 아무 키도 눌리지 않을 때 default
            timeoutId = setTimeout(() => {
                animatedGif_Selever.src = "../images/game/3/Selever_idle.gif";
            }, 500);
        }

        // 게임 화면 이동 메서드_USER
        function animateBackgroundMoveByUser() {
            let startTime = null;
            const duration = 500; 
            const moveDistance = 30; 
            const initialLeft = parseInt(backgroundImage.style.left) || 0;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const moveLeft = moveDistance * progress;
                backgroundImage.style.left = `${initialLeft + moveLeft}px`;

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    backgroundImage.style.left = `${initialLeft + moveDistance}px`;
                }
            }

            requestAnimationFrame(step);
        }

        // 게임 화면 이동 메서드_RUV
        function animateBackgroundReturnByUser() {
            let startTime = null;
            const duration = 500; // 애니메이션 이동 기간
            const moveDistance = 30; // 화면 이동 거리
            const initialLeft = parseInt(backgroundImage.style.left) || 0;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const moveBack = moveDistance * progress;

                // 게임 화면 이동
                backgroundImage.style.left = `${initialLeft - moveBack}px`;

                if (progress < 1) {
                    requestAnimationFrame(step);
                }
            }

            requestAnimationFrame(step);
        }


        let enterPressed = false;
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !enterPressed) {
                enterPressed = true;
                startCountdown();
            } else {
                checkKeyPress(e);
            }
        });

        function startCountdown() {
            countdownIndex = 0;
            countdownY = -50;
            const beepAudio = new Audio('../music/Ready.mp3');
            beepAudio.volume = 0.5;
            beepAudio.play();
            countdownInterval = setInterval(() => {
                if (countdownIndex < countdown.length) {
                    moveWord(countdown[countdownIndex]);
                    countdownIndex++;
                } else {
                    clearInterval(countdownInterval);
                    startGame();
                }
            }, 500);
        }

        function moveWord(message) {
            countdownY = 300; // 초기 글자 위치
            const startTime = Date.now();
            const duration = 200; // 글자 이동 간격

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                countdownY = 200 + (canvas.height / 2 - 200) * progress;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawLines();
                drawFallingKeys();

                const countdownFontSize = Math.min(canvas.width, canvas.height) * 0.04;
                ctx.font = `${countdownFontSize}px Arial`;
                ctx.fillStyle = "#FFF";
                ctx.textAlign = "center";
                ctx.fillText(message, canvas.width / 2, countdownY);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        }

        function startGame() {
            // 검정 화면 이미지 상태 변수
            backgroundBlack.style.opacity = "0"; // 이미지 숨긴 상태
            backgroundImage.style.opacity = "1"; // 이미지 보이는 상태

            // GIF 보이기 메서드
            if (!gifShown) {
                animatedGif_Ruv.style.display = "block";
                animatedGif_Selever.style.display = "block";
                gifShown = true;
            }

            // 음악 시작 메서드
            const beepAudio = new Audio('../music/Zavodila.mp3');
            beepAudio.volume = 0.5;
            beepAudio.play();

            // 악보 송출 메서드
            predefinedKeys.forEach((keyData) => {
                setTimeout(() => {
                    generateFallingKey();
                }, keyData.time);
            });

            // 게임 루프 시작 메서드
            function gameLoop() {
                drawLines();
                drawFallingKeys();
                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        }
    </script>

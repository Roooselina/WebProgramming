<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout & Space Invader</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        canvas {
            background: #000;
            display: block;
            margin: 0 auto;
            width: 100%;
            height: 100%;
        }
    </style>
    <script>
        document.addEventListener("keydown", function (event) {
            const iframe = document.getElementById("gameIframe");
            if (event.key === "Tab") {
                event.preventDefault(); // 기본 동작 방지
                if (!document.fullscreenElement) {
                    iframe.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });
    </script>
</head>

<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        let gameStarted = false;
        let levelSelected = false;
        let selectedLevel = 0;
        const levels = ["BREAKOUT", "SPACE INVADER"];
        const levelDescriptions = [
            "패드를 움직어 블럭을 부숴보세요!",
            "스페이스바를 눌러서 적들을 물리치세요!"
        ];
        let breakoutGameWon = false;
        let confirmSelected = 0;
        const confirmOptions = ["YES", "NO"];

        // Draw Start Message
        function drawStartMessage() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "40px Migae, sans-serif";
            ctx.fillStyle = "#FFF";
            ctx.textAlign = "center";
            ctx.fillText("PRESS SPACE TO START", canvas.width / 2, canvas.height / 2);
        }

        let BreakAudio = new Audio('../music/Beep.mp3');
        BreakAudio.volume = 0.5;
        BreakAudio.preload = 'auto';
        BreakAudio.playbackRate = 1.0;

        // 레벨 그리기
        function drawLevelSelection() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = (canvas.width / 18) + "px Migae, sans-serif";
            ctx.fillStyle = "#FFF";
            ctx.textAlign = "center";
            ctx.fillText("Choose Your Game", canvas.width / 2, canvas.height / 3 + 50);

            // 설명 텍스트
            ctx.font = "30px Arial, sans-serif";
            ctx.fillText(levelDescriptions[selectedLevel], canvas.width / 2, 2 * (canvas.height / 4));

            // 설명 위 선
            const lineXStart = canvas.width / 4;
            const lineXEnd = (canvas.width / 4) * 3;
            ctx.beginPath();
            ctx.moveTo(lineXStart, canvas.height / 7 * 3);
            ctx.lineTo(lineXEnd, canvas.height / 7 * 3);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 설명 아래 선
            ctx.beginPath();
            ctx.moveTo(lineXStart, (canvas.height / 5) * 3);
            ctx.lineTo(lineXEnd, (canvas.height / 5) * 3);
            ctx.stroke();

            // 게임 레벨 선택 텍스트 가로로 배치 (간격 좁힘)
            levels.forEach((level, index) => {
                ctx.font = (canvas.width / 38) + "px Migae, sans-serif"
                ctx.fillStyle = index === selectedLevel ? "#FFD700" : "#FFF";

                // 간격을 좁히기 위해 더 작은 값을 사용하여 x 좌표 계산
                const levelSpacing = canvas.width / (levels.length + 2); // 기존보다 조금 더 가까이
                const levelX = levelSpacing * (index + 1.5); // 시작 위치를 약간 가운데로

                const levelY = 3 * (canvas.height / 4);

                ctx.fillText(
                    (index === selectedLevel ? "> " : "") + level,
                    levelX,
                    levelY
                );
            });
        }


        function shakeScreen() {
            const canvas = document.getElementById("canvas");

            const intensity = 50; // 흔들림 강도
            const duration = 300; // 흔들림 지속 시간 (밀리초)
            let startTime = Date.now();

            function shake() {
                const elapsed = Date.now() - startTime;
                if (elapsed < duration) {
                    const offsetX = (Math.random() - 0.5) * intensity;
                    const offsetY = (Math.random() - 0.5) * intensity;
                    canvas.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
                    requestAnimationFrame(shake);
                } else {
                    // 흔들림이 끝난 후 원래 위치로 되돌림
                    canvas.style.transform = "translate(0, 0)";
                }
            }

            shake();
        }

        function fadeOutAudio(audio, duration = 500) {
            const step = audio.volume / (duration / 10);
            const fadeOutInterval = setInterval(() => {
                if (audio.volume > step) {
                    audio.volume -= step;
                } else {
                    audio.volume = 0;
                    audio.pause();
                    audio.currentTime = 0;
                    clearInterval(fadeOutInterval);
                }
            }, 10);
        }


        BreakOutAudio = new Audio('../music/BreakOut.mp3');
        BreakOutAudio.volume = 0.5;
        BreakOutAudio.preload = 'auto';
        BreakOutAudio.playbackRate = 1.0;

        SpaceInvaderAudio = new Audio('../music/SpaceInvader.mp3');
        SpaceInvaderAudio.volume = 0.5;
        SpaceInvaderAudio.preload = 'auto';
        SpaceInvaderAudio.playbackRate = 1.0;


        EndGame = new Audio('../music/CardGame.mp3');
        EndGame.volume = 0.5;
        EndGame.preload = 'auto';
        EndGame.playbackRate = 1.0;
        EndGame.currentTime = 1;

        function breakout() {
            // BREAK OUT 캔버스 세팅
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");

            // BALL 기본 세팅
            let ballX = canvas.width / 2;
            let ballY = canvas.height - 30;
            let ballRadius = 10;
            let ballDX = 4;
            let ballDY = -4;

            // 패들 기본 세팅
            const paddleHeight = 10;
            const paddleWidth = 100;
            let paddleX = (canvas.width - paddleWidth) / 2;

            // 컨트롤 키 세팅
            let rightPressed = false;
            let leftPressed = false;

            // 블럭들 세팅
            const blockRowCount = 1;
            const blockColumnCount = 1;
            const blockWidth = canvas.width / 10;
            const blockHeight = 20;
            const blockPadding = 10;
            const blockOffsetTop = 30;
            const blockOffsetLeft = 30;
            const blocks = [];

            let blockDX = 2; // 블럭 이동 스피드 세팅

            for (let c = 0; c < blockColumnCount; c++) {
                blocks[c] = [];
                for (let r = 0; r < blockRowCount; r++) {
                    const blockX = c * (blockWidth + blockPadding) + blockOffsetLeft;
                    const blockY = r * (blockHeight + blockPadding) + blockOffsetTop;
                    blocks[c][r] = { x: blockX, y: blockY, status: 1 };
                }
            }

            // BREAK OUT 키 컨트롤러
            document.addEventListener("keydown", breakoutKeyDownHandler, false);
            document.addEventListener("keyup", breakoutKeyUpHandler, false);

            function breakoutKeyDownHandler(e) {
                if (e.key === "D" || e.key === "d") {
                    rightPressed = true;
                } else if (e.key === "A" || e.key === "a") {
                    leftPressed = true;
                } else if (breakoutGameWon && (e.key === "D" || e.key === "d" || e.key === "A" || e.key === "a")) {
                    confirmSelected = confirmSelected === 0 ? 1 : 0;
                    drawCongratulations();
                } else if (breakoutGameWon && e.key === " ") {
                    if (confirmSelected === 0) {
                        breakoutGameWon = false;
                        levelSelected = false;
                        drawLevelSelection();
                    } else {
                        if (!breakoutGameWon)
                            document.location.reload();
                    }
                }
            }

            function breakoutKeyUpHandler(e) {
                if (e.key === "d" || e.key === "D") {
                    rightPressed = false;
                } else if (e.key === "a" || e.key === "A") {
                    leftPressed = false;
                }
            }

            function breakoutDrawBall() {
                ctx.beginPath();
                ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
                ctx.fillStyle = "#0095DD";
                ctx.fill();
                ctx.closePath();
            }

            function breakoutDrawPaddle() {
                ctx.beginPath();
                ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
                ctx.fillStyle = "#0095DD";
                ctx.fill();
                ctx.closePath();
            }

            function breakoutDrawBlocks() {
                for (let c = 0; c < blockColumnCount; c++) {
                    for (let r = 0; r < blockRowCount; r++) {
                        if (blocks[c][r].status === 1) {
                            const blockX = blocks[c][r].x;
                            const blockY = blocks[c][r].y;
                            ctx.beginPath();
                            ctx.rect(blockX, blockY, blockWidth, blockHeight);
                            ctx.fillStyle = "#0095DD";
                            ctx.fill();
                            ctx.closePath();
                        }
                    }
                }
            }

            function breakoutMoveBlocks() {
                for (let c = 0; c < blockColumnCount; c++) {
                    for (let r = 0; r < blockRowCount; r++) {
                        if (blocks[c][r].status === 1) {
                            blocks[c][r].x += blockDX;
                        }
                    }
                }

                // Reverse direction if blocks hit the wall
                if (blocks[0][0].x < 0 || blocks[blockColumnCount - 1][0].x + blockWidth > canvas.width) {
                    blockDX = -blockDX;
                }
            }

            function breakoutCollisionDetection() {
                let allBlocksCleared = true;
                for (let c = 0; c < blockColumnCount; c++) {
                    for (let r = 0; r < blockRowCount; r++) {
                        const b = blocks[c][r];
                        if (b.status === 1) {
                            allBlocksCleared = false;
                            if (
                                ballX > b.x &&
                                ballX < b.x + blockWidth &&
                                ballY > b.y &&
                                ballY < b.y + blockHeight
                            ) {
                                ballDY = -ballDY;
                                b.status = 0;
                                shakeScreen();
                                BreakAudio.play();
                            }
                        }
                    }
                }
                if (allBlocksCleared) {
                    breakoutGameWon = true;
                    drawCongratulations();
                }
            }



            function breakoutDraw() {
                if (!breakoutGameWon) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    breakoutMoveBlocks();
                    breakoutDrawBlocks();
                    breakoutDrawBall();
                    breakoutDrawPaddle();
                    breakoutCollisionDetection();

                    // 볼 움직임 구현
                    if (ballX + ballDX > canvas.width - ballRadius || ballX + ballDX < ballRadius) {
                        ballDX = -ballDX;
                    }
                    if (ballY + ballDY < ballRadius) {
                        ballDY = -ballDY;
                    } else if (ballY + ballDY > canvas.height - ballRadius) {
                        if (ballX > paddleX && ballX < paddleX + paddleWidth) {
                            ballDY = -ballDY;
                        } else {
                            // Game over
                            document.location.reload();
                        }
                    }

                    ballX += ballDX;
                    ballY += ballDY;

                    // 패들 움직임 구현
                    if (rightPressed && paddleX < canvas.width - paddleWidth) {
                        paddleX += 7;
                    } else if (leftPressed && paddleX > 0) {
                        paddleX -= 7;
                    }

                    requestAnimationFrame(breakoutDraw);
                }
            }

            breakoutDraw();
        }

        // BreakOut 게임 메서드
        function startBreakout() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            breakout();
        }

        let SpaceInvaderGameWon = false;

        // SPACE INVADER 게임 메서드
        function spaceInvader() {
            // SPACE INVADER 게임 캔버스 세팅
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // 게임 플레이어 세팅
            let player = {
                x: canvas.width / 2 - 25,
                y: canvas.height - 50,
                width: 50,
                height: 20,
                speed: 5
            };
            let bullets = [];
            let enemies = [];
            let enemyBullets = [];
            let isGameOver = false;

            // 게임 키 컨트롤 세팅
            let rightPressed = false;
            let leftPressed = false;

            // 키 컨트롤 구현
            document.addEventListener('keydown', spaceInvaderKeyDownHandler, false);
            document.addEventListener('keyup', spaceInvaderKeyUpHandler, false);

            function spaceInvaderKeyDownHandler(e) {
                if (e.key === 'd' || e.key === 'D') {
                    rightPressed = true;
                } else if (e.key === 'a' || e.key === 'A') {
                    leftPressed = true;
                } else if (e.key === ' ' && bullets.length < 5) {
                    bullets.push({
                        x: player.x + player.width / 2 - 2.5,
                        y: player.y,
                        width: 5,
                        height: 10,
                        speed: 7
                    });
                }
            }

            function spaceInvaderKeyUpHandler(e) {
                if (e.key === 'd' || e.key === 'D') {
                    rightPressed = false;
                } else if (e.key === 'a' || e.key === 'A') {
                    leftPressed = false;
                }
            }


            // 적 스폰 세팅
            function spawnEnemies() {
                for (let row = 0; row < 1; row++) {
                    for (let col = 0; col < 1; col++) {
                        enemies.push({
                            x: col * 120 + 60,
                            y: row * 80 + 60,
                            width: 80,
                            height: 50,
                            direction: 1
                        });
                    }
                }
            }
            spawnEnemies();

            // 게임 UPDATE 메서드
            function update() {
                // Player movement
                if (rightPressed && player.x + player.width < canvas.width) {
                    player.x += player.speed;
                }
                if (leftPressed && player.x > 0) {
                    player.x -= player.speed;
                }

                // 총알 그리기 메서드
                bullets.forEach((bullet, index) => {
                    bullet.y -= bullet.speed;
                    if (bullet.y < 0) {
                        bullets.splice(index, 1);
                    }
                });

                // ENEMY 위치 업데이트
                for (let i = 0; i < enemies.length; i++) {
                    const enemy = enemies[i];
                    enemy.x += enemy.direction * 2;

                    // 위치 1 낮추기
                    if (enemy.x + enemy.width > canvas.width || enemy.x < 0) {
                        enemy.direction *= -1;
                        enemy.y += 10;
                    }

                    // 적 VS 주인공 충돌 감지
                    if (
                        enemy.x < player.x + player.width &&
                        enemy.x + enemy.width > player.x &&
                        enemy.y < player.y + player.height &&
                        enemy.y + enemy.height > player.y
                    ) {
                        isGameOver = true;
                        setTimeout(() => {
                            alert('You Lose!');
                            document.location.reload();
                        }, 500);
                        break; // 게임 EXIT
                    }

                    // 총알 랜덤 발사 메서드
                    if (Math.random() < 0.005 && Math.random() < 0.5) {
                        enemyBullets.push({
                            x: enemy.x + enemy.width / 2 - 2.5,
                            y: enemy.y + enemy.height,
                            width: 5,
                            height: 10,
                            speed: 5
                        });
                    }
                }

                // 총알 적 업데이트
                enemyBullets.forEach((bullet, index) => {
                    bullet.y += bullet.speed;
                    if (bullet.y > canvas.height) {
                        enemyBullets.splice(index, 1);
                    }

                    // 총알 충돌 검사
                    if (
                        bullet.x < player.x + player.width &&
                        bullet.x + bullet.width > player.x &&
                        bullet.y < player.y + player.height &&
                        bullet.y + bullet.height > player.y
                    ) {
                        isGameOver = true;
                        setTimeout(() => {
                            alert('You Lose!');
                            document.location.reload();
                        }, 500);
                    }
                });

                // 적 충돌 검사
                bullets.forEach((bullet, bIndex) => {
                    enemies.forEach((enemy, eIndex) => {
                        if (
                            bullet.x < enemy.x + enemy.width &&
                            bullet.x + bullet.width > enemy.x &&
                            bullet.y < enemy.y + enemy.height &&
                            bullet.y + bullet.height > enemy.y
                        ) {
                            enemies.splice(eIndex, 1);
                            bullets.splice(bIndex, 1);
                            shakeScreen();
                            BreakAudio.play();
                        }
                    });
                });

                // 게임 종료 조건 검사
                if (enemies.length === 0) {
                    isGameOver = true;
                    SpaceInvaderGameWon = true;
                }
            }

            // 그리기 메서드
            function draw() {
                // 캔버스 초기화
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 플레이어 그리기
                ctx.fillStyle = 'green';
                ctx.fillRect(player.x, player.y, player.width, player.height);

                // 적 그리기
                ctx.fillStyle = 'red';
                bullets.forEach(bullet => {
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                });

                // 총알 그리기
                ctx.fillStyle = 'orange';
                enemyBullets.forEach(bullet => {
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                });

                // 적 그리기
                ctx.fillStyle = 'blue';
                enemies.forEach(enemy => {
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                });
            }

            // 게임 루프 진행
            function gameLoop() {
                if (!isGameOver) {
                    update();
                    draw();
                    requestAnimationFrame(gameLoop);
                } else if (enemies.length === 0) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    drawCongratulations();
                }
            }
            gameLoop();
        }

        function startSpaceInvader() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            spaceInvader();
        }

        // 게임 선택 메서드
        function startLevel(levelIndex) {
            if (levelIndex === 0) {
                startBreakout();
                BreakOutAudio.play();
            } else if (levelIndex === 1) {
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                startSpaceInvader();
                SpaceInvaderAudio.volume = 0.1;
                SpaceInvaderAudio.play();

            }
        }

        // 초기 문구 그리기
        drawStartMessage();

        function drawCongratulations() {
            fadeOutAudio(BreakOutAudio);
            fadeOutAudio(SpaceInvaderAudio);

            // 별가루 배열 초기화
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const stars = Array.from({ length: 100 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                opacity: Math.random(),
                size: Math.random() * 2 + 1,
                speed: Math.random() * 2 + 0.5,
            }));

            let fadeOpacity = 1;
            const fadeOutDuration = 60; // 애니메이션 지속 시간
            let fadeCompleted = false;

            function animate() {
                if (!breakoutGameWon && !SpaceInvaderGameWon) {
                    return; // breakoutGameWon이 false이면 애니메이션 중지
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 화면이 하얘지게 (한 번만 실행)
                if (!fadeCompleted) {
                    if (fadeOpacity > 0) {
                        ctx.fillStyle = `rgba(255, 255, 255, ${fadeOpacity})`;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        fadeOpacity -= 1 / fadeOutDuration;
                    } else {
                        fadeCompleted = true;
                    }
                }

                // "CONGRATULATIONS!" 텍스트
                ctx.font = "100px Migae, sans-serif";
                ctx.fillStyle = "#FFF";
                ctx.textAlign = "center";
                ctx.fillText("CONGRATULATIONS!", canvas.width / 2, canvas.height / 3);

                ctx.font = "50px Migae, sans-serif";
                ctx.fillText("Go back home?", canvas.width / 2, canvas.height / 2 - 50);

                // 확인 옵션
                confirmOptions.forEach((option, index) => {
                    ctx.font = "50px Migae, sans-serif";
                    ctx.fillStyle = index === confirmSelected ? "#FFD700" : "#FFF";
                    const optionX = canvas.width / 3 + index * (canvas.width / 3);
                    const optionY = canvas.height / 2 + 150;
                    ctx.fillText(option, optionX, optionY);
                });

                // 별가루 효과
                stars.forEach((star) => {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.fill();

                    // 별가루 이동
                    star.y -= star.speed;
                    if (star.y < 0) {
                        star.y = canvas.height;
                        star.x = Math.random() * canvas.width;
                    }
                });

                requestAnimationFrame(animate);
            }

            if ((breakoutGameWon || SpaceInvaderGameWon) && !congratulationDisplayed) {
                congratulationDisplayed = true; // 축하 애니메이션이 한 번만 실행되도록 설정
                animate();
            }
        }

        const clickAudio = new Audio('../music/Beep.mp3');
        clickAudio.preload = 'auto';
        clickAudio.playbackRate = 1.0;

        const MenuAudio = new Audio('../music/GameMenu.mp3');
        MenuAudio.currentTime = 1;
        MenuAudio.volume = 0.7;
        MenuAudio.preload = 'auto';
        MenuAudio.playbackRate = 1.0;

        let congratulationDisplayed = false; // 축하 이벤트 한 번만 표시하는 변수
        let menuMusicPlay = false; // 음악 한 번만 실행
        let congratulationMusicPlay = false;

        document.addEventListener("keydown", (e) => {
            if (e.key === " " && !gameStarted) {
                gameStarted = true;
                drawLevelSelection();
            } else if (gameStarted && !levelSelected) {
                if (!menuMusicPlay) {
                    MenuAudio.play();  // MenuAudio 오브젝트 재생
                    menuMusicPlay = true;  // 이미 재생 중임을 표시
                }
                if (e.key === "ArrowUp" || e.key === "w" || e.key === "A" || e.key === "a") {
                    selectedLevel = Math.max(0, selectedLevel - 1);
                    clickAudio.cloneNode(true).play();
                    drawLevelSelection();
                } else if (e.key === "ArrowDown" || e.key === "s" || e.key === "D" || e.key === "d") {
                    selectedLevel = Math.min(levels.length - 1, selectedLevel + 1);
                    clickAudio.cloneNode(true).play();
                    drawLevelSelection();
                } else if (e.key === " ") {
                    levelSelected = true;
                    startLevel(selectedLevel);
                    fadeOutAudio(MenuAudio);
                }
            } else if ((breakoutGameWon || SpaceInvaderGameWon) && congratulationDisplayed) {
                if (!congratulationMusicPlay) {
                    EndGame.play();
                    congratulationMusicPlay = true;  // 이미 재생 중임을 표시
                }
                if (e.key === "ArrowLeft" || e.key === "A" || e.key === "a") {
                    confirmSelected = Math.max(0, confirmSelected - 1);
                    drawCongratulations();
                } else if (e.key === "ArrowRight" || e.key === "D" || e.key === "d") {
                    confirmSelected = Math.min(confirmOptions.length - 1, confirmSelected + 1);
                    drawCongratulations();
                } else if (e.key === " ") {
                    breakoutGameWon = false;
                    SpaceInvaderGameWon = false;
                    levelSelected = false;
                    congratulationDisplayed = false;
                    congratulationMusicPlay = false;
                    if (confirmSelected === 0) {
                        gameStarted = false;
                        document.location.reload();
                    } else {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        congratulationMusicPlay = false;
                        fadeOutAudio(EndGame);
                        drawLevelSelection();
                    }
                }
            }
        });


        // 캔버스 크기 조정
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (!gameStarted) {
                drawStartMessage();
            } else if (gameStarted && !levelSelected) {
                drawLevelSelection();
            } else if (breakoutGameWon) {
                drawCongratulations();
            }
        });
    </script>
</body>

</html>

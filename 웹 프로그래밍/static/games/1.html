<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout & Space Invader</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        canvas {
            background: #000;
            display: block;
            margin: 0 auto;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        let gameStarted = false;
        let levelSelected = false;
        let selectedLevel = 0;
        const levels = ["BREAKOUT", "SPACE INVADER"];
        const levelDescriptions = [
            "패들을 움직여 블럭을 부숴보세요.",
            "스페이스바를 눌러서 적들을 물리치세요."
        ];
        let breakoutGameWon = false;
        let confirmSelected = 0;
        const confirmOptions = ["YES", "NO"];

        // Draw Start Message
        function drawStartMessage() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "40px Arial, sans-serif";
            ctx.fillStyle = "#FFF";
            ctx.textAlign = "center";
            ctx.fillText("PRESS SPACE TO START", canvas.width / 2, canvas.height / 2);
        }

        // Draw Level Selection
        function drawLevelSelection() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "80px Migae, sans-serif";
            ctx.fillStyle = "#FFF";
            ctx.textAlign = "center";
            ctx.fillText("Choose Your Game", canvas.width / 2, canvas.height / 3 + 50);

            // 설명 텍스트
            ctx.font = "30px Arial, sans-serif";
            ctx.fillText(levelDescriptions[selectedLevel], canvas.width / 2, canvas.height / 3 + 150);

            // 설명 위 선
            const lineXStart = canvas.width / 4;
            const lineXEnd = (canvas.width / 4) * 3;
            ctx.beginPath();
            ctx.moveTo(lineXStart, 600);
            ctx.lineTo(lineXEnd, 600);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 설명 아래 선
            ctx.beginPath();
            ctx.moveTo(lineXStart, 400);
            ctx.lineTo(lineXEnd, 400);
            ctx.stroke();

            // 게임 레벨 선택 텍스트 가로로 배치 (간격 좁힘)
            levels.forEach((level, index) => {
                ctx.font = "50px Migae, sans-serif";
                ctx.fillStyle = index === selectedLevel ? "#FFD700" : "#FFF";

                // 간격을 좁히기 위해 더 작은 값을 사용하여 x 좌표 계산
                const levelSpacing = canvas.width / (levels.length + 2); // 기존보다 조금 더 가까이
                const levelX = levelSpacing * (index + 1.5); // 시작 위치를 약간 가운데로

                const levelY = 3 * (canvas.height / 4);

                ctx.fillText(
                    (index === selectedLevel ? "> " : "") + level,
                    levelX,
                    levelY
                );
            });
        }

        function shakeScreen() {
            const canvas = document.getElementById("canvas");

            const intensity = 50; // 흔들림 강도
            const duration = 300; // 흔들림 지속 시간 (밀리초)
            let startTime = Date.now();

            function shake() {
                const elapsed = Date.now() - startTime;
                if (elapsed < duration) {
                    const offsetX = (Math.random() - 0.5) * intensity;
                    const offsetY = (Math.random() - 0.5) * intensity;
                    canvas.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
                    requestAnimationFrame(shake);
                } else {
                    // 흔들림이 끝난 후 원래 위치로 되돌림
                    canvas.style.transform = "translate(0, 0)";
                }
            }

            shake();
        }

        function fadeOutAudio(audio, duration = 500) {
            const step = audio.volume / (duration / 10);
            const fadeOutInterval = setInterval(() => {
                if (audio.volume > step) {
                    audio.volume -= step;
                } else {
                    audio.volume = 0;
                    audio.pause();
                    audio.currentTime = 0;
                    clearInterval(fadeOutInterval);
                }
            }, 10);
        }


        BreakOutAudio = new Audio('../music/BreakOut.mp3');
        BreakOutAudio.volume = 0.5;
        BreakOutAudio.preload = 'auto';
        BreakOutAudio.playbackRate = 1.0;

        EndGame = new Audio('../music/CardGame.mp3');
        EndGame.volume = 0.5;
        EndGame.preload = 'auto';
        EndGame.playbackRate = 1.0;

        function breakout() {
            // Set up the canvas and context
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");

            // Ball properties
            let ballX = canvas.width / 2;
            let ballY = canvas.height - 30;
            let ballRadius = 10;
            let ballDX = 4;
            let ballDY = -4;

            // Paddle properties
            const paddleHeight = 10;
            const paddleWidth = 100;
            let paddleX = (canvas.width - paddleWidth) / 2;

            // Controls
            let rightPressed = false;
            let leftPressed = false;

            // Blocks
            const blockRowCount = 1;
            const blockColumnCount = 1;
            const blockWidth = canvas.width;
            const blockHeight = 20;
            const blockPadding = 10;
            const blockOffsetTop = 30;
            const blockOffsetLeft = 30;
            const blocks = [];

            let blockDX = 2; // Speed for blocks moving left and right

            for (let c = 0; c < blockColumnCount; c++) {
                blocks[c] = [];
                for (let r = 0; r < blockRowCount; r++) {
                    const blockX = c * (blockWidth + blockPadding) + blockOffsetLeft;
                    const blockY = r * (blockHeight + blockPadding) + blockOffsetTop;
                    blocks[c][r] = { x: blockX, y: blockY, status: 1 };
                }
            }

            // Key listeners
            document.addEventListener("keydown", breakoutKeyDownHandler, false);
            document.addEventListener("keyup", breakoutKeyUpHandler, false);

            function breakoutKeyDownHandler(e) {
                if (e.key === "D" || e.key === "d") {
                    rightPressed = true;
                } else if (e.key === "A" || e.key === "a") {
                    leftPressed = true;
                } else if (breakoutGameWon && (e.key === "D" || e.key === "d" || e.key === "A" || e.key === "a")) {
                    confirmSelected = confirmSelected === 0 ? 1 : 0;
                    drawCongratulations();
                } else if (breakoutGameWon && e.key === " ") {
                    if (confirmSelected === 0) {
                        breakoutGameWon = false;
                        levelSelected = false;
                        drawLevelSelection();
                    } else {
                        if (!breakoutGameWon)
                            document.location.reload();
                    }
                }
            }

            function breakoutKeyUpHandler(e) {
                if (e.key === "d" || e.key === "D") {
                    rightPressed = false;
                } else if (e.key === "a" || e.key === "A") {
                    leftPressed = false;
                }
            }

            function breakoutDrawBall() {
                ctx.beginPath();
                ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
                ctx.fillStyle = "#0095DD";
                ctx.fill();
                ctx.closePath();
            }

            function breakoutDrawPaddle() {
                ctx.beginPath();
                ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
                ctx.fillStyle = "#0095DD";
                ctx.fill();
                ctx.closePath();
            }

            function breakoutDrawBlocks() {
                for (let c = 0; c < blockColumnCount; c++) {
                    for (let r = 0; r < blockRowCount; r++) {
                        if (blocks[c][r].status === 1) {
                            const blockX = blocks[c][r].x;
                            const blockY = blocks[c][r].y;
                            ctx.beginPath();
                            ctx.rect(blockX, blockY, blockWidth, blockHeight);
                            ctx.fillStyle = "#0095DD";
                            ctx.fill();
                            ctx.closePath();
                        }
                    }
                }
            }

            function breakoutMoveBlocks() {
                for (let c = 0; c < blockColumnCount; c++) {
                    for (let r = 0; r < blockRowCount; r++) {
                        if (blocks[c][r].status === 1) {
                            blocks[c][r].x += blockDX;
                        }
                    }
                }

                // Reverse direction if blocks hit the wall
                if (blocks[0][0].x < 0 || blocks[blockColumnCount - 1][0].x + blockWidth > canvas.width) {
                    blockDX = -blockDX;
                }
            }

            function breakoutCollisionDetection() {
                let allBlocksCleared = true;
                for (let c = 0; c < blockColumnCount; c++) {
                    for (let r = 0; r < blockRowCount; r++) {
                        const b = blocks[c][r];
                        if (b.status === 1) {
                            allBlocksCleared = false;
                            if (
                                ballX > b.x &&
                                ballX < b.x + blockWidth &&
                                ballY > b.y &&
                                ballY < b.y + blockHeight
                            ) {
                                ballDY = -ballDY;
                                b.status = 0;
                                shakeScreen();
                            }
                        }
                    }
                }
                if (allBlocksCleared) {
                    breakoutGameWon = true;
                    drawCongratulations();
                }
            }



            function breakoutDraw() {
                if (!breakoutGameWon) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    breakoutMoveBlocks();
                    breakoutDrawBlocks();
                    breakoutDrawBall();
                    breakoutDrawPaddle();
                    breakoutCollisionDetection();

                    // Ball movement
                    if (ballX + ballDX > canvas.width - ballRadius || ballX + ballDX < ballRadius) {
                        ballDX = -ballDX;
                    }
                    if (ballY + ballDY < ballRadius) {
                        ballDY = -ballDY;
                    } else if (ballY + ballDY > canvas.height - ballRadius) {
                        if (ballX > paddleX && ballX < paddleX + paddleWidth) {
                            ballDY = -ballDY;
                        } else {
                            // Game over
                            document.location.reload();
                        }
                    }

                    ballX += ballDX;
                    ballY += ballDY;

                    // Paddle movement
                    if (rightPressed && paddleX < canvas.width - paddleWidth) {
                        paddleX += 7;
                    } else if (leftPressed && paddleX > 0) {
                        paddleX -= 7;
                    }

                    requestAnimationFrame(breakoutDraw);
                }
            }

            breakoutDraw();
        }

        // Start Breakout Game
        function startBreakout() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            breakout();
        }

        // Start Level Function
        function startLevel(levelIndex) {
            if (levelIndex === 0) {
                startBreakout();
                BreakOutAudio.play();
            } else if (levelIndex === 1) {
                startSpaceInvader();
            }
        }

        // Initial Drawing
        drawStartMessage();

        function drawCongratulations() {
            EndGame.currentTime = 1;
            EndGame.play();
            fadeOutAudio(BreakOutAudio);

            // 별가루 배열 초기화
            const stars = Array.from({ length: 100 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                opacity: Math.random(),
                size: Math.random() * 2 + 1,
                speed: Math.random() * 2 + 0.5,
            }));

            let fadeOpacity = 1;
            const fadeOutDuration = 60; // 애니메이션 프레임 지속 시간
            let fadeCompleted = false;

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 화면이 하얗게 변함 (한 번만 실행)
                if (!fadeCompleted) {
                    if (fadeOpacity > 0) {
                        ctx.fillStyle = `rgba(255, 255, 255, ${fadeOpacity})`;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        fadeOpacity -= 1 / fadeOutDuration;
                    } else {
                        fadeCompleted = true;
                    }
                }

                // "CONGRATULATIONS!" 텍스트
                ctx.font = "100px Migae, sans-serif";
                ctx.fillStyle = "#FFF";
                ctx.textAlign = "center";
                ctx.fillText("CONGRATULATIONS!", canvas.width / 2, canvas.height / 3);

                ctx.font = "50px Migae, sans-serif";
                ctx.fillText("Go back home?", canvas.width / 2, canvas.height / 2 - 50);

                // 확인 옵션
                confirmOptions.forEach((option, index) => {
                    ctx.font = "50px Migae, sans-serif";
                    ctx.fillStyle = index === confirmSelected ? "#FFD700" : "#FFF";
                    const optionX = canvas.width / 3 + index * (canvas.width / 3);
                    const optionY = canvas.height / 2 + 150;
                    ctx.fillText(option, optionX, optionY);
                });

                // 별가루 효과 (계속 실행)
                stars.forEach((star) => {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.fill();

                    // 별가루 이동
                    star.y -= star.speed;
                    if (star.y < 0) {
                        star.y = canvas.height;
                        star.x = Math.random() * canvas.width;
                    }
                });

                requestAnimationFrame(animate);
            }

            animate();
        }


        const clickAudio = new Audio('../music/Beep.mp3');
        clickAudio.preload = 'auto';
        clickAudio.playbackRate = 1.0;

        let congratulationDisplayed = false; // 축하 화면이 처음 한 번만 표시되도록 추적

        document.addEventListener("keydown", (e) => {
            if (e.key === " " && !gameStarted) {
                gameStarted = true;
                drawLevelSelection();
            } else if (gameStarted && !levelSelected) {
                if (e.key === "ArrowUp" || e.key === "w" || e.key === "A" || e.key === "a") {
                    selectedLevel = Math.max(0, selectedLevel - 1);
                    clickAudio.cloneNode(true).play();
                    drawLevelSelection();
                } else if (e.key === "ArrowDown" || e.key === "s" || e.key === "D" || e.key === "d") {
                    selectedLevel = Math.min(levels.length - 1, selectedLevel + 1);
                    clickAudio.cloneNode(true).play();
                    drawLevelSelection();
                } else if (e.key === " ") {
                    levelSelected = true;
                    startLevel(selectedLevel);
                }
            } else if (breakoutGameWon) {
                if (e.key === "ArrowLeft" || e.key === "A" || e.key === "a") {
                    confirmSelected = Math.max(0, confirmSelected - 1);
                    drawCongratulationsOnce();
                } else if (e.key === "ArrowRight" || e.key === "D" || e.key === "d") {
                    confirmSelected = Math.min(confirmOptions.length - 1, confirmSelected + 1);
                    drawCongratulationsOnce();
                } else if (e.key === " ") {
                    breakoutGameWon = false;
                    levelSelected = false;
                    if (confirmSelected === 0) {
                        gameStarted = false;
                        document.location.reload();
                    } else {
                        drawLevelSelection();
                    }
                }
            }
        });

        // Resize canvas on window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (!gameStarted) {
                drawStartMessage();
            } else if (gameStarted && !levelSelected) {
                drawLevelSelection();
            } else if (breakoutGameWon) {
                drawCongratulations();
            }
        });
    </script>
</body>

</html>
